<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Heritage | 디지털 헤리티지</title>
  <meta name="description" content="디지털 헤리티지 큐레이터팀 3D 스캔 유물 컬렉션" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500;600&family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #04030a;
      cursor: none; /* hide default cursor */
    }

    /* ══ 3D VIEWER BACKGROUND ══ */
    #bg-viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      z-index: 1;
    }

    /* ══ DARK CANVAS OVERLAY (spotlight) ══ */
    #spotlight-canvas {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    /* ══ CUSTOM CURSOR ══ */
    #cursor {
      position: fixed;
      z-index: 100;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
    }
    #cursor-ring {
      width: 40px; height: 40px;
      border: 1.5px solid rgba(200, 170, 90, 0.7);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: cursorPulse 2.5s ease-in-out infinite;
    }
    #cursor-dot {
      width: 5px; height: 5px;
      background: rgba(210, 180, 100, 0.9);
      border-radius: 50%;
    }
    @keyframes cursorPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* ══ UI OVERLAY (text, button) ══ */
    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Logo top-left */
    .intro-logo {
      position: fixed;
      top: 36px; left: 44px;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      animation: fadeInUp 1.2s ease 0.5s forwards;
    }
    .intro-logo-en {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(200, 170, 90, 0.7);
      display: block;
      margin-bottom: 2px;
    }
    .intro-logo-kr {
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.06em;
    }

    /* Artifact name — bottom left */
    .artifact-label {
      position: fixed;
      bottom: 52px; left: 48px;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      animation: fadeInUp 1.2s ease 1s forwards;
    }
    .artifact-label-acc {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(200,170,90,0.6);
      margin-bottom: 5px;
    }
    .artifact-label-name {
      font-family: 'Noto Serif KR', serif;
      font-size: 22px;
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      line-height: 1.3;
    }
    .artifact-label-hanja {
      font-family: 'Noto Serif KR', serif;
      font-size: 13px;
      font-weight: 300;
      color: rgba(255,255,255,0.35);
      margin-top: 3px;
    }

    /* Hint text — center bottom */
    .hint-text {
      position: fixed;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      animation: fadeInUp 1.4s ease 1.5s forwards;
    }
    .hint-text p {
      font-family: 'Noto Serif KR', serif;
      font-size: 12.5px;
      font-weight: 300;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
    }
    .scroll-indicator {
      margin-top: 12px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .scroll-indicator span {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 0.22em;
      color: rgba(200,170,90,0.5);
    }
    .scroll-arrow {
      width: 1px;
      height: 32px;
      background: linear-gradient(to bottom, rgba(200,170,90,0.5), transparent);
      animation: scrollLine 2s ease-in-out infinite;
    }
    @keyframes scrollLine {
      0% { transform: scaleY(0); transform-origin: top; opacity: 1; }
      50% { transform: scaleY(1); transform-origin: top; opacity: 1; }
      51% { transform: scaleY(1); transform-origin: bottom; }
      100% { transform: scaleY(0); transform-origin: bottom; opacity: 0.3; }
    }

    /* Enter button */
    #enter-btn {
      position: fixed;
      bottom: 52px; right: 48px;
      z-index: 30;
      pointer-events: all;
      cursor: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #enter-btn.show { opacity: 1; }
    #enter-btn .btn-inner {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 24px;
      border: 1px solid rgba(200,170,90,0.45);
      border-radius: 100px;
      background: rgba(200,170,90,0.06);
      backdrop-filter: blur(8px);
      color: rgba(200,170,90,0.85);
      font-family: 'Noto Serif KR', serif;
      font-size: 13px; font-weight: 400;
      letter-spacing: 0.06em;
      transition: all 0.3s ease;
    }
    #enter-btn:hover .btn-inner {
      background: rgba(200,170,90,0.15);
      border-color: rgba(200,170,90,0.7);
      color: rgba(200,170,90,1);
      box-shadow: 0 0 24px rgba(200,170,90,0.15);
    }
    .btn-arrow { font-size: 16px; transition: transform 0.3s; }
    #enter-btn:hover .btn-arrow { transform: translateX(4px); }

    /* Reveal progress ring (top right) */
    .progress-ring-wrap {
      position: fixed;
      bottom: 60px; right: 52px;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      animation: fadeInUp 1.4s ease 2s forwards;
    }
    #progress-ring-svg {
      width: 42px; height: 42px;
      transform: rotate(-90deg);
    }
    #progress-track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 2; }
    #progress-fill {
      fill: none;
      stroke: rgba(200,170,90,0.7);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 113;
      stroke-dashoffset: 113;
      transition: stroke-dashoffset 0.3s ease;
    }
    .progress-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 9px;
      color: rgba(200,170,90,0.6);
      transform: rotate(0);
    }

    /* Page transition overlay */
    #transition-veil {
      position: fixed; inset: 0;
      z-index: 999;
      background: #04030a;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    #transition-veil.out { opacity: 1; pointer-events: all; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Subtle vignette around edges */
    #vignette {
      position: fixed; inset: 0; z-index: 9;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(4,3,10,0.6) 100%);
    }
  </style>
</head>
<body>

  <!-- 3D MODEL BACKGROUND -->
  <model-viewer
    id="bg-viewer"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="8deg"
    shadow-intensity="0"
    exposure="0.8"
    tone-mapping="commerce"
    alt="3D 유물 모델"
  ></model-viewer>

  <!-- EDGE VIGNETTE -->
  <div id="vignette"></div>

  <!-- SPOTLIGHT CANVAS -->
  <canvas id="spotlight-canvas"></canvas>

  <!-- CUSTOM CURSOR -->
  <div id="cursor">
    <div id="cursor-ring">
      <div id="cursor-dot"></div>
    </div>
  </div>

  <!-- TOP LEFT: LOGO -->
  <div class="intro-logo">
    <span class="intro-logo-en">DIGITAL HERITAGE</span>
    <span class="intro-logo-kr">디지털 헤리티지 큐레이터</span>
  </div>

  <!-- BOTTOM LEFT: ARTIFACT LABEL -->
  <div class="artifact-label" id="artifact-label">
    <div class="artifact-label-acc" id="lbl-acc"></div>
    <div class="artifact-label-name" id="lbl-name"></div>
    <div class="artifact-label-hanja" id="lbl-hanja"></div>
  </div>

  <!-- HINT CENTER BOTTOM -->
  <div class="hint-text">
    <p>마우스를 움직여 유물을 탐색하세요</p>
    <div class="scroll-indicator">
      <span>EXPLORE</span>
      <div class="scroll-arrow"></div>
    </div>
  </div>

  <!-- PROGRESS RING -->
  <div class="progress-ring-wrap" id="progress-ring-wrap">
    <svg id="progress-ring-svg" viewBox="0 0 42 42">
      <circle id="progress-track" cx="21" cy="21" r="18" />
      <circle id="progress-fill"  cx="21" cy="21" r="18" />
    </svg>
    <div class="progress-label" id="progress-label">0%</div>
  </div>

  <!-- ENTER BUTTON (appears at ~70% reveal) -->
  <div id="enter-btn" onclick="enterSite()" onmouseenter="btnHovered=true" onmouseleave="btnHovered=false">
    <div class="btn-inner">
      <span>컬렉션 입장</span>
      <span class="btn-arrow">→</span>
    </div>
  </div>

  <!-- PAGE TRANSITION VEIL -->
  <div id="transition-veil"></div>

<script>
  /* ─── Artifact data ─── */
  const ARTIFACTS = [
    {
      glb: '41_deci.glb',
      acc: 'No. 18-1',
      name: '수막새',
      hanja: '八葉蓮花紋瓦當'
    },
    {
      glb: 'Untitled.glb',
      acc: 'No. 81',
      name: '청자 주전자',
      hanja: '靑瓷酒煎子'
    }
  ];

  /* ─── Pick random artifact ─── */
  const picked = ARTIFACTS[Math.floor(Math.random() * ARTIFACTS.length)];
  document.getElementById('bg-viewer').setAttribute('src', picked.glb);
  document.getElementById('lbl-acc').textContent   = picked.acc;
  document.getElementById('lbl-name').textContent  = picked.name;
  document.getElementById('lbl-hanja').textContent = picked.hanja;

  /* ─── Canvas spotlight setup ─── */
  const canvas = document.getElementById('spotlight-canvas');
  const ctx    = canvas.getContext('2d');

  let W = window.innerWidth;
  let H = window.innerHeight;
  let mx = W / 2, my = H / 2;
  let spotR = 160; // spotlight radius
  let btnHovered = false;
  let entered = false;

  /* Reveal tracking — grid of revealed cells */
  const CELLS = 24;
  const cellW  = () => W / CELLS;
  const cellH  = () => H / CELLS;
  const revealed = new Set();
  let revealPct = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W;
    canvas.height = H;
    revealed.clear();
    revealPct = 0;
    updateProgress(0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ─── Mouse tracking ─── */
  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;

    // Move custom cursor
    const c = document.getElementById('cursor');
    c.style.left = mx + 'px';
    c.style.top  = my + 'px';

    // Mark cells revealed
    const cx = Math.floor(mx / cellW());
    const cy = Math.floor(my / cellH());
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const key = `${cx+dx},${cy+dy}`;
        revealed.add(key);
      }
    }

    const total = CELLS * CELLS;
    revealPct = Math.min(revealed.size / total, 1);
    updateProgress(revealPct);
  });

  /* ─── Progress ring update ─── */
  const fillEl  = document.getElementById('progress-fill');
  const labelEl = document.getElementById('progress-label');
  const enterBtn = document.getElementById('enter-btn');
  const CIRCUMFERENCE = 2 * Math.PI * 18; // r=18

  function updateProgress(pct) {
    const offset = CIRCUMFERENCE * (1 - pct);
    fillEl.style.strokeDashoffset = offset;
    labelEl.textContent = Math.round(pct * 100) + '%';

    if (pct >= 0.6 && !entered) {
      enterBtn.classList.add('show');
    }
  }

  /* ─── Render loop ─── */
  function render() {
    ctx.clearRect(0, 0, W, H);

    // Dark base layer
    ctx.fillStyle = 'rgba(4, 3, 12, 0.97)';
    ctx.fillRect(0, 0, W, H);

    // Spotlight cutout using destination-out
    ctx.globalCompositeOperation = 'destination-out';

    const r = btnHovered ? spotR * 0.6 : spotR;

    const grad = ctx.createRadialGradient(mx, my, 0, mx, my, r);
    grad.addColorStop(0,   'rgba(0,0,0,1)');
    grad.addColorStop(0.45,'rgba(0,0,0,0.92)');
    grad.addColorStop(0.75,'rgba(0,0,0,0.5)');
    grad.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(render);
  }
  render();

  /* ─── Touch support ─── */
  document.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    mx = t.clientX;
    my = t.clientY;
    document.getElementById('cursor').style.left = mx + 'px';
    document.getElementById('cursor').style.top  = my + 'px';
  }, { passive: false });

  /* ─── Click anywhere to enter (if enough revealed) ─── */
  document.addEventListener('click', () => {
    if (revealPct >= 0.5) enterSite();
  });

  /* ─── Enter site transition ─── */
  function enterSite() {
    if (entered) return;
    entered = true;
    const veil = document.getElementById('transition-veil');
    veil.classList.add('out');
    setTimeout(() => {
      window.location.href = 'collection.html';
    }, 900);
  }

  /* ─── Spotlight breathes in size ─── */
  let t = 0;
  setInterval(() => {
    t += 0.04;
    spotR = 155 + Math.sin(t) * 12;
  }, 30);
</script>
</body>
</html>
