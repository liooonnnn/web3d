<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>유물 상세정보 | Digital Heritage Collection</title>
  <meta name="description" content="디지털 헤리티지 큐레이터 유물 상세정보 및 3D 뷰어 페이지" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- model-viewer CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f5f0;
      --surface: #ffffff;
      --surface2: #fdf9f4;
      --border: #e8e0d4;
      --border-hover: #c8a96e;
      --text-primary: #1a1410;
      --text-secondary: #6b5c4a;
      --text-muted: #9e8e7c;
      --accent: #8b6914;
      --accent-light: #c8a96e;
      --accent-glow: rgba(139, 105, 20, 0.12);
      --tag-bg: #f0e8d8;
      --tag-text: #7a5c2a;
      --shadow-sm: 0 2px 8px rgba(90,70,40,0.08);
      --shadow-md: 0 8px 32px rgba(90,70,40,0.12);
      --radius: 16px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      position: sticky;
      top: 0; z-index: 100;
      background: rgba(248,245,240,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .nav-logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .nav-logo-text { display: flex; flex-direction: column; line-height: 1.2; }
    .nav-logo-title { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.08em; }
    .nav-logo-sub { font-family: 'Noto Serif KR', serif; font-size: 11px; color: var(--text-muted); letter-spacing: 0.05em; }
    .nav-links { display: flex; align-items: center; gap: 8px; list-style: none; }
    .nav-links a { font-size: 14px; color: var(--text-secondary); text-decoration: none; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; font-weight: 500; }
    .nav-links a:hover { color: var(--accent); background: var(--accent-glow); }

    /* ─── Breadcrumb ─── */
    .breadcrumb {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 32px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb-sep { color: var(--border-hover); }

    /* ─── Page Layout ─── */
    .detail-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 32px 80px;
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 32px;
      align-items: start;
    }

    /* ─── Viewer Panel ─── */
    .viewer-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .viewer-wrapper {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: linear-gradient(160deg, #fdf7ee 0%, #f0e6d4 100%);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* model-viewer styling */
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
    }

    /* Placeholder (no data) */
    .no-data-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      background: linear-gradient(160deg, #fdf7ee 0%, #f0e6d4 100%);
    }
    .no-data-illustration {
      width: 160px;
      height: 160px;
      object-fit: contain;
      opacity: 0.7;
      filter: drop-shadow(0 8px 20px rgba(90,60,20,0.12));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .no-data-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .no-data-icon {
      width: 52px; height: 52px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: var(--shadow-sm);
    }
    .no-data-text {
      font-family: 'Noto Serif KR', serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .no-data-sub {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.5;
    }

    /* Upload CTA */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--surface);
    }
    .upload-zone:hover {
      border-color: var(--accent-light);
      background: var(--accent-glow);
    }
    .upload-zone-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .upload-zone-text strong {
      color: var(--accent);
    }
    #glb-upload-input { display: none; }
    .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 9px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.2s;
    }
    .upload-btn:hover {
      background: #7a5c10;
      transform: translateY(-1px);
    }

    /* Viewer controls (visible when model loaded) */
    .viewer-controls {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }
    .viewer-controls.visible { display: flex; }
    .ctrl-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .ctrl-btn:hover { border-color: var(--accent-light); color: var(--accent); background: var(--accent-glow); }
    .ctrl-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

    /* ─── Info Panel ─── */
    .info-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: sticky;
      top: 96px;
    }

    /* Title block */
    .info-title-block {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }
    .info-accession {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }
    .info-title-kr {
      font-family: 'Noto Serif KR', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .info-title-hanja {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .info-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
    }
    .tag-period { background: var(--tag-bg); color: var(--tag-text); }
    .tag-3d-unavail { background: #f5f0ea; color: var(--text-muted); border: 1px solid var(--border); }
    .tag-3d-avail { background: #f0faf4; color: #2a8a4a; border: 1px solid #a8ddb8; }

    /* Detail table */
    .detail-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .detail-card-header {
      padding: 16px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
    }
    .detail-table tr {
      border-bottom: 1px solid var(--border);
    }
    .detail-table tr:last-child { border-bottom: none; }
    .detail-table td {
      padding: 12px 24px;
      font-size: 13px;
      line-height: 1.6;
      vertical-align: top;
    }
    .detail-table .td-key {
      color: var(--text-muted);
      font-weight: 500;
      white-space: nowrap;
      width: 80px;
    }
    .detail-table .td-val {
      color: var(--text-secondary);
    }
    .detail-table .td-val strong {
      color: var(--text-primary);
    }

    /* Description card */
    .desc-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .desc-card-header {
      padding: 16px 24px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .desc-card-body {
      padding: 20px 24px;
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.9;
    }

    /* Back button */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 0;
      transition: gap 0.2s;
    }
    .back-link:hover { gap: 12px; }

    /* ─── Workspace Link ─── */
    .workspace-link-card {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: var(--radius);
      padding: 24px;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .workspace-link-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(139,105,20,0.3);
    }
    .ws-link-text-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .ws-link-text-sub {
      font-size: 12px;
      opacity: 0.8;
    }
    .ws-link-icon { font-size: 28px; flex-shrink: 0; }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .detail-page {
        grid-template-columns: 1fr;
      }
      .info-panel { position: static; }
    }
    @media (max-width: 600px) {
      .nav-inner { padding: 0 16px; }
      .breadcrumb { padding: 16px 16px 0; }
      .detail-page { padding: 20px 16px 60px; gap: 20px; }
      .info-title-block { padding: 20px; }
      .info-title-kr { font-size: 22px; }
    }
  </style>
</head>
<body>

  <!-- ─── Header ─── -->
  <header>
    <nav class="nav-inner">
      <a href="collection.html" class="nav-logo">
        <div class="nav-logo-icon">🏛️</div>
        <div class="nav-logo-text">
          <span class="nav-logo-title">DIGITAL HERITAGE</span>
          <span class="nav-logo-sub">디지털 헤리티지 큐레이터</span>
        </div>
      </a>
      <ul class="nav-links">
        <li><a href="collection.html" class="active">컬렉션</a></li>
        <li><a href="index.html">3D 워크스페이스</a></li>
      </ul>
    </nav>
  </header>

  <!-- ─── Breadcrumb ─── -->
  <div class="breadcrumb">
    <a href="collection.html">컬렉션</a>
    <span class="breadcrumb-sep">›</span>
    <span id="breadcrumb-name">유물 상세</span>
  </div>

  <!-- ─── Main Content ─── -->
  <div class="detail-page">

    <!-- Left: Viewer -->
    <div class="viewer-panel">
      <div class="viewer-wrapper" id="viewer-wrapper">

        <!-- model-viewer (hidden until model loaded) -->
        <model-viewer
          id="artifact-model-viewer"
          camera-controls
          auto-rotate
          auto-rotate-delay="1000"
          rotation-per-second="20deg"
          ar
          ar-modes="webxr scene-viewer quick-look"
          shadow-intensity="1"
          exposure="1"
          style="display:none; width:100%; height:100%;"
        ></model-viewer>

        <!-- No Data Overlay -->
        <div class="no-data-overlay" id="no-data-overlay">
          <img class="no-data-illustration" id="artifact-illustration" src="" alt="유물 일러스트" />
          <div class="no-data-badge">
            <div class="no-data-icon">📦</div>
            <div class="no-data-text">3D 자료없음</div>
            <div class="no-data-sub">
              아직 3D 스캔 데이터가 준비되지 않았습니다.<br />
              아래 버튼으로 GLB 파일을 직접 불러올 수 있습니다.
            </div>
          </div>
        </div>

      </div>

      <!-- Viewer controls (shown after load) -->
      <div class="viewer-controls" id="viewer-controls">
        <button class="ctrl-btn" onclick="toggleAutoRotate()" id="btn-rotate">⟳ 자동 회전</button>
        <button class="ctrl-btn" onclick="toggleWireframe()" id="btn-wire">⬡ 와이어프레임</button>
        <button class="ctrl-btn" onclick="resetCamera()">↺ 뷰 초기화</button>
      </div>

      <!-- Upload zone -->
      <div class="upload-zone" id="upload-zone-area" onclick="document.getElementById('glb-upload-input').click()">
        <input type="file" id="glb-upload-input" accept=".glb,.gltf" />
        <p class="upload-zone-text">
          <strong>GLB 파일을 불러오려면 클릭</strong>하거나 여기에 파일을 드래그하세요.<br />
          지원 형식: .glb, .gltf
        </p>
        <button class="upload-btn" type="button">📂 파일 선택</button>
      </div>

      <!-- Workspace link -->
      <a href="index.html" class="workspace-link-card">
        <div>
          <div class="ws-link-text-title">🔬 3D 큐레이터 워크스페이스 열기</div>
          <div class="ws-link-text-sub">측정 도구 · 조명 조절 · 어노테이션 · 스크린샷</div>
        </div>
        <div class="ws-link-icon">→</div>
      </a>
    </div>

    <!-- Right: Info Panel -->
    <div class="info-panel">

      <!-- Title -->
      <div class="info-title-block">
        <div class="info-accession" id="info-accession">No. —</div>
        <h1 class="info-title-kr" id="info-title-kr">유물명</h1>
        <div class="info-title-hanja" id="info-title-hanja">한자명</div>
        <div class="info-tags" id="info-tags">
          <span class="tag tag-period" id="tag-period">시기</span>
          <span class="tag tag-3d-unavail" id="tag-3d">⬜ 3D 자료없음</span>
        </div>
      </div>

      <!-- Spec table -->
      <div class="detail-card">
        <div class="detail-card-header">📋 유물 제원</div>
        <table class="detail-table" id="spec-table">
          <!-- filled by JS -->
        </table>
      </div>

      <!-- Description -->
      <div class="desc-card">
        <div class="desc-card-header">📝 상세 설명</div>
        <div class="desc-card-body" id="desc-body">
          <!-- filled by JS -->
        </div>
      </div>

    </div>
  </div>

  <script>
    // ─── Artifact Data ───────────────────────────────────────────────────────
    const artifacts = {
      'roof-tile': {
        accession: 'No. 18-1',
        titleKr: '수막새',
        titleHanja: '八葉蓮花紋瓦當 (팔엽연화문와당)',
        period: '백제',
        illustration: 'artifact_roof_tile.png',
        has3D: false,
        specs: [
          ['명칭', '8엽연화문와당'],
          ['소장번호', '18-1'],
          ['시기', '백제'],
          ['색조', '연화색, 흑색이 약간 보임'],
          ['태토', '고운편이며 다량의 모래 포함'],
          ['지름', '15.5 cm'],
          ['두께', '3.4 cm'],
          ['연자', '7과'],
        ],
        description: `이 수막새는 <strong>백제 시대</strong>의 대표적인 기와 장식품으로, 공식 명칭은 <strong>8엽연화문와당(八葉蓮花紋瓦當)</strong>입니다.<br /><br />
          중앙에 8개의 연꽃잎(八葉蓮花紋)이 아름답게 배치된 문양이 특징으로, 가장자리 일부가 파손된 상태이나 핵심 문양은 잘 보존되어 있습니다. 
          연자(蓮子)가 7과 확인됩니다.<br /><br />
          태토는 고운 편이며 다량의 모래가 포함되어 있고, 연화색을 기본으로 흑색이 약간 나타납니다. 
          백제 기와 제작 기술의 정교함을 잘 보여주는 자료입니다.`
      },
      'celadon-teapot': {
        accession: 'No. 81',
        titleKr: '청자 주전자',
        titleHanja: '靑瓷酒煎子 (청자주전자)',
        period: '고려시대',
        illustration: 'artifact_celadon_teapot.png',
        has3D: false,
        specs: [
          ['명칭', '청자 주전자'],
          ['소장번호', '81'],
          ['시기', '고려시대 추정'],
          ['색조', '녹청색의 유약'],
          ['바닥', '평저(平底)'],
          ['굽지름', '9.6 cm'],
          ['높이', '16.1 cm'],
          ['구경', '3.27 cm'],
        ],
        description: `이 청자 주전자는 <strong>고려시대</strong> 제작된 것으로 추정되는 도자기로, 공식 명칭은 <strong>청자 주전자(靑瓷酒煎子)</strong>입니다.<br /><br />
          몸체는 <strong>난형(卵形, 달걀 모양)</strong>이며, 원래 손잡이가 달려 있었을 것으로 추측되나 현재는 떨어져 나간 상태입니다. 
          주둥이가 길게 뻗어 있으며, 매우 좁은 구연부에 뚜껑받침이 마련되어 있습니다.<br /><br />
          <strong>녹청색의 고려청자 유약</strong>이 특징적으로, 고려 청자 특유의 맑고 투명한 비색(翡色)에 가까운 색조를 보입니다. 
          바닥은 굽 없이 편평한 평저(平底) 형태입니다. 고려시대 청자 문화의 정수를 보여주는 중요한 유물입니다.`
      }
    };

    // ─── Init ────────────────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id') || 'roof-tile';
    const data = artifacts[id] || artifacts['roof-tile'];

    // Update document title
    document.title = `${data.titleKr} | Digital Heritage Collection`;

    // Breadcrumb
    document.getElementById('breadcrumb-name').textContent = data.titleKr;

    // Title block
    document.getElementById('info-accession').textContent = data.accession;
    document.getElementById('info-title-kr').textContent = data.titleKr;
    document.getElementById('info-title-hanja').textContent = data.titleHanja;
    document.getElementById('tag-period').textContent = data.period;

    // Illustration
    document.getElementById('artifact-illustration').src = data.illustration;
    document.getElementById('artifact-illustration').alt = data.titleKr + ' 일러스트';

    // 3D tag
    const tag3d = document.getElementById('tag-3d');
    if (data.has3D) {
      tag3d.textContent = '✅ 3D 뷰 가능';
      tag3d.className = 'tag tag-3d-avail';
    }

    // Spec table
    const specsHTML = data.specs.map(([k, v]) => `
      <tr>
        <td class="td-key">${k}</td>
        <td class="td-val">${v}</td>
      </tr>`).join('');
    document.getElementById('spec-table').innerHTML = specsHTML;

    // Description
    document.getElementById('desc-body').innerHTML = data.description;

    // ─── File Upload ─────────────────────────────────────────────────────────
    const fileInput = document.getElementById('glb-upload-input');
    const modelViewer = document.getElementById('artifact-model-viewer');
    const noDataOverlay = document.getElementById('no-data-overlay');
    const uploadZone = document.getElementById('upload-zone-area');
    const viewerControls = document.getElementById('viewer-controls');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      loadModel(file);
    });

    // Drag and drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = 'var(--accent)';
      uploadZone.style.background = 'var(--accent-glow)';
    });
    uploadZone.addEventListener('dragleave', () => {
      uploadZone.style.borderColor = '';
      uploadZone.style.background = '';
    });
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.style.borderColor = '';
      uploadZone.style.background = '';
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.glb') || file.name.endsWith('.gltf'))) {
        loadModel(file);
      }
    });

    function loadModel(file) {
      const url = URL.createObjectURL(file);
      modelViewer.src = url;
      modelViewer.style.display = 'block';
      noDataOverlay.style.display = 'none';
      viewerControls.classList.add('visible');
      tag3d.textContent = '✅ 3D 뷰 가능';
      tag3d.className = 'tag tag-3d-avail';
    }

    // ─── Viewer Controls ─────────────────────────────────────────────────────
    let autoRotateOn = true;
    let wireframeOn = false;

    function toggleAutoRotate() {
      autoRotateOn = !autoRotateOn;
      modelViewer.autoRotate = autoRotateOn;
      document.getElementById('btn-rotate').classList.toggle('active', autoRotateOn);
    }

    function toggleWireframe() {
      wireframeOn = !wireframeOn;
      document.getElementById('btn-wire').classList.toggle('active', wireframeOn);
      // model-viewer doesn't have native wireframe, apply CSS mix-blend-mode trick
      modelViewer.style.filter = wireframeOn ? 'invert(1) contrast(2)' : '';
    }

    function resetCamera() {
      modelViewer.cameraOrbit = 'auto auto auto';
      modelViewer.cameraTarget = 'auto auto auto';
    }
  </script>
</body>
</html>
